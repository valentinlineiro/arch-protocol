name: ARCH Skill Tests

on:
  push:
    paths:
      - 'plugins/arch-protocol/skills/arch-protocol/SKILL.md'
      - 'tests/**'
      - 'specs/**'
  pull_request:
    paths:
      - 'plugins/arch-protocol/skills/arch-protocol/SKILL.md'
      - 'tests/**'
      - 'specs/**'

jobs:
  marker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scenario markers against SKILL.md
        run: bash scripts/check-markers.sh

  skill-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check behavioral spec against SKILL.md
        run: python3 scripts/check-skill-integrity.py
